services:
  mongo:
    image: mongo:7
    container_name: bk-mongo
    ports:
      - '27017:27017'
    volumes:
      - ./.data/mongo:/data/db
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'mongosh', '--quiet', '--eval', "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: bk-redis
    ports:
      - '6379:6379'
    volumes:
      - ./.data/redis:/data
    restart: unless-stopped
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
